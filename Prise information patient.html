<style>
:root{
  --bg:#0f1624; --panel:#182236; --line:#2a3955; --text:#e8edf6; --muted:#8fa0bd;
  --accent:#3b9dff; --accent-ink:#06121f; --ok:#34c77b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef2f8; --panel:#ffffff; --line:#d3dbe8; --text:#14203a; --muted:#5c6b86;
    --accent:#1f7ae0; --accent-ink:#ffffff; --ok:#1e9d5c;
  }
}
:root[data-theme="light"]{
  --bg:#eef2f8; --panel:#ffffff; --line:#d3dbe8; --text:#14203a; --muted:#5c6b86;
  --accent:#1f7ae0; --accent-ink:#ffffff; --ok:#1e9d5c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
.logo{width:44px;height:44px;border-radius:10px;flex:none}
h1{font-size:22px;margin:0}
p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.field{margin-bottom:16px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:6px}
button{font:inherit;font-weight:600;font-size:16px;border-radius:10px;padding:13px 16px;cursor:pointer}
#copy{flex:1;background:var(--accent);color:var(--accent-ink);border:0}
#copy.done{background:var(--ok)}
#clear{background:transparent;color:var(--muted);border:1px solid var(--line)}
</style>
</head>

  <div class="card">
    <div class="field"><label for="demandeur">EHPAD/Médecin demandeur</label><input id="demandeur" autocomplete="off"></div>
    <div class="field"><label for="nom">Nom et prénom</label><input id="nom" autocomplete="off"></div>
    <div class="field"><label for="naissance">Date de naissance</label><input id="naissance" inputmode="numeric" placeholder="jj/mm/aaaa" autocomplete="off"></div>
    <div class="field"><label for="examen">Examen</label><input id="examen" autocomplete="off"></div>
    <div class="field"><label for="adresse">Adresse</label><input id="adresse" autocomplete="off"></div>
    <div class="field"><label for="tel">Numéro de téléphone</label><input id="tel" type="tel" autocomplete="off"></div>
    <div class="actions">
      <button id="clear" type="button">Effacer</button>
      <button id="copy" type="button">Copier</button>
    </div>
  </div>
</main>
<script>
(function(){
  var champs=[
    ["demandeur","EHPAD/Médecin demandeur"],
    ["nom","Nom et prénom"],
    ["naissance","Date de naissance"],
    ["examen","Examen"],
    ["adresse","Adresse"],
    ["tel","Numéro de téléphone"]
  ];
  var btn=document.getElementById("copy");
  function texte(){
    return champs.map(function(c){
      return c[1]+" : "+document.getElementById(c[0]).value.trim();
    }).join("\n");
  }
  function fallback(t){
    var ta=document.createElement("textarea");
    ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  function confirmer(ok){
    btn.textContent=ok?"Copié":"Copie impossible";
    btn.classList.toggle("done",ok);
    setTimeout(function(){btn.textContent="Copier";btn.classList.remove("done");},1800);
  }
  btn.addEventListener("click",function(){
    var t=texte();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){confirmer(true);},function(){confirmer(fallback(t));});
    }else{confirmer(fallback(t));}
  });
  document.getElementById("naissance").addEventListener("input",function(e){
    var d=this.value.replace(/\D/g,"").slice(0,8);
    var out=d;
    if(d.length>4){out=d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4);}
    else if(d.length>2){out=d.slice(0,2)+"/"+d.slice(2);}
    this.value=out;
  });
  document.getElementById("clear").addEventListener("click",function(){
    champs.forEach(function(c){document.getElementById(c[0]).value="";});
    document.getElementById("demandeur").focus();
  });
})();
</script>
